name: cc-switch release

# cc-switch 品牌层出包流水线（三平台：Windows x64 / Linux x64 / macOS universal）。
#
# [monorepo] 本产品位于仓库子目录 cc-switch/，故每个 job 都声明
#   defaults.run.working-directory: cc-switch
# 使全部 run 步骤的相对路径（scripts/、brand/、upstream/、release-assets/）语义与
# 单仓时代完全一致。注意两类例外：
#   - step 级 working-directory 一律写成 ${{ github.workspace }}/cc-switch/... 绝对路径。
#     官方文档只规定「更具体的默认值覆盖更宽的」，未规定 step 级相对路径以 workspace 根
#     还是以 job 默认值为基准 —— 绝对路径在两种语义下都成立，不赌未文档化的行为。
#   - uses: 型步骤（upload/download-artifact）不受 defaults.run 影响，其 path: 必须
#     显式带 cc-switch/ 前缀。
#
# 设计（与 auto-upgrade / open-code release 同构，适配 Tauri + pnpm + R2）：
#   - submodule（cc-switch/upstream/）永远锁在干净上游 tag，定制全在 brand/（patches +
#     overlay + i18n + updater.conf.json）；
#   - 出包 = 干净 checkout submodule 到 BASE_TAG → scripts/apply-patches.sh 完整重放
#     （补丁 strict apply + overlay 复制 + i18n 合并 + updater 注入）→
#     pnpm tauri build（minisign 签名产 .sig）；
#   - 产物 + 组装后的 latest.json 写到 Cloudflare R2 dl.dokng.com/cc-switch/。
#     补丁 01 已把 Tauri updater endpoint 指到 https://dl.dokng.com/cc-switch/latest.json。
#     [monorepo] R2 是唯一分发源，不再发 GitHub Release —— 本仓只保留 tag。
#
# 平台范围（本期）：Win x64 / Linux x64 / macOS universal。
#   不含 Win ARM64 / Linux ARM64（ARM runner 有额外成本，本期不做）。
#   不做 Apple 公证 / Windows 代码签名（需付费证书，本期不做）——用户首次安装会有
#   系统安全警告，但 minisign 更新签名照做，自更新链路完整。
#
# 签名：TAURI_SIGNING_PRIVATE_KEY（minisign 私钥，与补丁 01 的 pubkey 配对）为必需 Secret。
#   缺失则产物无 .sig、客户端验签失败、自更新废掉——故设为硬失败。
#
# 触发：push tag v*-ccs.*（auto-upgrade 每日升级后会打 vX.Y.Z-ccs.N 并推送，即触发本流水线）；
#   workflow_dispatch 手动触发：
#     - tag 留空（推荐）→ resolve job 用 next-version.sh 自动算下一个 vX.Y.Z-ccs.N，
#       建 tag 并推送（下游 build/publish 用这个版本）；
#     - tag 填已存在的版本 → 补发那一版（不新建 tag）。
#
# 需要的 Secret：
#   TAURI_SIGNING_PRIVATE_KEY          minisign 私钥（两行原文 / base64 / 一行 base64 均可）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（本密钥对为空密码，可不设）
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET
#                                      R2 上传凭据（缺失则跳过 R2 步骤，产物仅留 artifact）

# 触发过滤：只认品牌发布 tag vX.Y.Z-ccs.N（auto-upgrade / resolve job 生成的格式）。
# 不用裸 "v*"——误推上游式 tag（如 v3.19.0）不应触发全量三平台出包。
on:
  push:
    tags:
      - "v*-ccs.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要出包的 tag（留空则自动算下一个 vX.Y.Z-ccs.N；填已存在的 tag 则补发那一版）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 统一解析出包版本号，作为下游所有 job 的唯一来源（避免各步骤各自 inputs.tag || ref_name）。
  #   - push tag 触发：直接用触发的 tag（github.ref_name）；
  #   - 手动触发且填了 tag：用填的（补发已存在版本）；
  #   - 手动触发未填 tag：用 next-version.sh 算下一个 vX.Y.Z-ccs.N，建 tag 并推送。
  resolve:
    name: 解析出包版本号
    runs-on: ubuntu-22.04
    # [monorepo] 全部 run 步骤落在 cc-switch/：scripts/next-version.sh 用 SCRIPT_DIR/..
    # 定位 PROJECT_ROOT，故它读到的是 cc-switch/brand/BASE_TAG（正确）。
    # git tag / git push 在子目录里执行等价于在仓库根执行（tag 是仓库全局的）。
    defaults:
      run:
        working-directory: cc-switch
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      app_version: ${{ steps.resolve.outputs.app_version }}
    steps:
      - name: Checkout（含全部 tag，供 next-version.sh 计算）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算/确定版本号
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            # tag 推送触发：ref_name 就是 tag。
            version="$REF_NAME"
            echo "push tag 触发，版本：$version"
          elif [ -n "${INPUT_TAG:-}" ]; then
            # 手动触发且填了 tag：补发已存在版本，不新建 tag。
            version="$INPUT_TAG"
            echo "手动补发已存在版本：$version"
          else
            # 手动触发未填 tag：自动算下一个 vX.Y.Z-ccs.N，建 tag 并推送。
            git fetch --tags --quiet origin || true
            version="$(scripts/next-version.sh)"
            [ -n "$version" ] || { echo "❌ next-version.sh 未算出版本号" >&2; exit 1; }
            echo "自动计算下一个版本：$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$version"
            git push origin "$version"
            echo "已建 tag 并推送：$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # app 内嵌版本 / latest.json 版本：把品牌预发布号 -ccs.N 转成纯数字 -N。
          # 原因：Windows MSI（WiX）要求 semver 预发布号纯数字（映射到 ProductVersion
          # 第 4 段，≤65535），"ccs" 含字母会让 msi 打包报错。tag 保留 -ccs.N 作品牌标识，
          # 但 app/latest.json 必须一致地用纯数字，否则 updater 版本比对错乱。
          # 形如 v3.17.0-ccs.4 → 3.17.0-4（剥前导 v、-ccs. 换 -）；无 -ccs. 的 tag 原样剥 v。
          app_version="${version#v}"
          app_version="${app_version/-ccs./-}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app 内嵌版本：$app_version"

  build:
    name: 构建（${{ matrix.label }}）
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x86_64
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-14
            label: macos-universal

    # [dokng] 提到 job 级：产物上传步骤用 if: env.R2_ACCESS_KEY_ID 在 R2 直传与 artifact
    # 回退之间二选一。step 级 env 对同一 step 的 if 不可见（if 在 step env 求值前判定），
    # uses: 型步骤更没有 env 块可写，故必须在 job 级声明。
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}

    defaults:
      run:
        working-directory: cc-switch

    steps:
      # [monorepo] submodules: false —— 绝不能用 recursive。本仓有三个 submodule
      # （cc-switch/upstream 77M、open-code/opencode 488M、open-code/infinite-canvas 6M），
      # recursive 会让本 job 白拉另一个产品的 494M。只按需初始化本产品这一个。
      - name: Checkout（checkout 到出包 tag，不带 submodule）
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.version }}

      # 不加 --depth=1：下一步要 fetch --tags 后 checkout 到 BASE_TAG，浅克隆下
      # 该 tag 的对象可能不在本地，且 apply-patches.sh 需要完整工作树做 strict apply。
      - name: 初始化 cc-switch/upstream submodule
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git submodule update --init cc-switch/upstream
          echo "submodule 就绪：$(git -C cc-switch/upstream rev-parse --short HEAD)"

      - name: 干净 checkout submodule 到 BASE_TAG 并按 NN 序重放补丁
        shell: bash
        run: |
          set -euo pipefail
          BASE_TAG="$(tr -d '[:space:]' < brand/BASE_TAG)"
          echo "基线 tag：$BASE_TAG"
          git -C upstream fetch --tags --quiet origin
          git -C upstream checkout --quiet "$BASE_TAG"
          git -C upstream reset --hard --quiet
          git -C upstream clean -fdq
          # 改动 submodule 前先做纯格式预检：corrupt patch / CRLF 必须零副作用提前失败，
          # 避免落地前序补丁后才在后序 patch 上失败。
          scripts/apply-patches.sh --preflight
          echo "完整重放品牌层（补丁 + overlay + i18n + updater 注入）："
          scripts/apply-patches.sh
          echo "品牌层重放成功。"

      - name: 注入定制版本号到 tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          # 关键：app 内嵌版本必须等于 latest.json 的 version，updater 才能正确比对。
          # 用 resolve 算好的 app_version（纯数字预发布号，如 3.17.0-4）——不能带 -ccs.，
          # 否则 Windows MSI 打包报「pre-release identifier must be numeric-only」。
          # 若不改，app 内嵌版本仍是上游 3.17.0，而 latest.json 写 3.17.0-4（semver 预发布号
          # 反而 < 3.17.0）→ updater 永远判定「无更新」→ 自更新彻底失效。
          CONF="upstream/src-tauri/tauri.conf.json"
          VERSION="$VERSION" python3 - "$CONF" <<'PY'
          import json, os, sys
          conf = sys.argv[1]
          with open(conf, encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = os.environ["VERSION"]
          with open(conf, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"tauri.conf.json version set to {data['version']}")
          PY

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Rust
        # channel 匹配 upstream/rust-toolchain.toml（锁 1.95）。注意：action 的 targets
        # 输入把 target 装到 action 自己解析的工具链名下，未必等于 upstream/ 内
        # rust-toolchain.toml override 解析出的那个 → 故 macOS 的双 target 改由下一步
        # 在 upstream/ 目录里显式 rustup target add 落地（确定性）。
        uses: dtolnay/rust-toolchain@1.95

      - name: macOS 双 target 装到 upstream 锁定的工具链上
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        shell: bash
        run: |
          set -euxo pipefail
          # 在 upstream/ 内跑：rustup 遵从此目录 rust-toolchain.toml 的 override，
          # 把 universal 所需两个 target 加到「tauri build 真正使用」的那个工具链上，
          # 从根上消除 "Target x86_64-apple-darwin is not installed"。
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: 安装前端依赖
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ "$attempt" = 3 ]; then
              echo "pnpm install 连续 3 次失败，放弃。" >&2
              exit 1
            fi
            echo "pnpm install 第 $attempt 次失败，$((attempt * 15))s 后重试…" >&2
            sleep $((attempt * 15))
          done

      - name: 准备 minisign 签名私钥
        shell: bash
        env:
          RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密码经 env 中转再进 shell——直接 ${{ }} 插值到脚本体内，密码含引号/反引号等
          # 特殊字符会破坏 shell 语法（也是潜在注入面）。
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW:-}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY 为空——无私钥则产物无 .sig、自更新验签失败。" >&2
            echo "请在 Settings > Secrets and variables > Actions 配置该 Secret。" >&2
            exit 1
          fi
          echo "::add-mask::$RAW"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 情况 1：两行原文（首行以 "untrusted comment:" 开头）
          if printf '%s' "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
          # 情况 2：整体 base64 包裹（解包后两行）
          elif DECODED=$(printf '%s' "$RAW" | base64 --decode 2>/dev/null) \
               && printf '%s' "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
          # 情况 3：一行纯 base64 → 补首行注释成两行
          elif printf '%s' "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
            printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
          else
            echo "❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别。" >&2
            exit 1
          fi
          # Tauri 接受完整私钥文本（base64 单行）注入环境变量。
          KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          echo "::add-mask::$KEY_B64"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${RAW_PW:-}" ]; then
            echo "::add-mask::$RAW_PW"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$RAW_PW" >> "$GITHUB_ENV"
          fi
          rm -f "$KEY_PATH"
          echo "✅ minisign 私钥就绪"

      - name: 构建 Tauri App（macOS universal）
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        timeout-minutes: 60
        run: pnpm tauri build --target universal-apple-darwin

      - name: 构建 Tauri App（Windows x64）
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        run: pnpm tauri build

      - name: 构建 Tauri App（Linux x64）
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: 收集 macOS 产物
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${{ needs.resolve.outputs.version }}"
          TAR_GZ=""; DMG=""
          for path in \
            "upstream/src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "upstream/src-tauri/target/release/bundle/macos"; do
            [ -d "$path" ] && [ -z "$TAR_GZ" ] && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true) || true
          done
          for path in \
            "upstream/src-tauri/target/universal-apple-darwin/release/bundle/dmg" \
            "upstream/src-tauri/target/release/bundle/dmg"; do
            [ -d "$path" ] && [ -z "$DMG" ] && DMG=$(find "$path" -maxdepth 1 -name "*.dmg" -type f | head -1 || true) || true
          done
          if [ -z "$TAR_GZ" ]; then
            echo "❌ 未找到 macOS updater 产物 .tar.gz" >&2
            exit 1
          fi
          # [dokng] universal 断言：组装 latest.json 时把这一个包同时喂给 darwin-aarch64
          # 与 darwin-x86_64，故它必须是双架构 fat binary。上面的路径 fallback 会在
          # universal-apple-darwin 目录缺失时捡起 target/release/bundle/macos 下的单架构
          # 包——那种包有一半 Mac 自更新后起不来，而 minisign 验签照样通过、下游无从发现。
          # 故在此硬校验，构建方式漂移时立刻失败而不是发出坏包。
          APP=$(find "$(dirname "$TAR_GZ")" -maxdepth 1 -name "*.app" -type d | head -1 || true)
          [ -n "$APP" ] || { echo "❌ 未找到 .app，无从校验 universal" >&2; exit 1; }
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1 || true)
          [ -n "$BIN" ] || { echo "❌ .app 内未找到主二进制" >&2; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "macOS 主二进制架构：$ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "❌ 主二进制缺 $want（实际：$ARCHS）——universal 构建未生效，拒绝发布" >&2; exit 1;;
            esac
          done
          cp "$TAR_GZ" "release-assets/CC-Switch-${VERSION}-macOS.tar.gz"
          [ -f "$TAR_GZ.sig" ] && cp "$TAR_GZ.sig" "release-assets/CC-Switch-${VERSION}-macOS.tar.gz.sig" \
            || { echo "❌ macOS .tar.gz.sig 缺失（签名失败？）" >&2; exit 1; }
          [ -n "$DMG" ] && cp "$DMG" "release-assets/CC-Switch-${VERSION}-macOS.dmg" || echo "无 DMG（可选）"

      - name: 收集 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:RESOLVED_VERSION
          $msi = Get-ChildItem -Path 'upstream/src-tauri/target/release/bundle/msi' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI installer found'
          }
          $dest = "CC-Switch-$VERSION-Windows.msi"
          Copy-Item $msi.FullName (Join-Path release-assets $dest)
          $sigPath = "$($msi.FullName).sig"
          if (Test-Path $sigPath) {
            Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
          } else {
            throw "Signature not found for $($msi.Name) (签名失败？)"
          }
          # 绿色版（portable）：仅 exe 打 zip，不参与 Updater
          $exePath = @(
            'upstream/src-tauri/target/release/cc-switch.exe',
            'upstream/src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            '# CC Switch portable build marker', 'portable=true' | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/CC-Switch-$VERSION-Windows-Portable.zip" -Force
            Remove-Item -Recurse -Force $portableDir
          }
        env:
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}

      - name: 收集 Linux 产物
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${{ needs.resolve.outputs.version }}"
          APPIMAGE=$(find upstream/src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ 未找到 AppImage（Linux updater 产物）" >&2
            exit 1
          fi
          cp "$APPIMAGE" "release-assets/CC-Switch-${VERSION}-Linux-x86_64.AppImage"
          [ -f "$APPIMAGE.sig" ] && cp "$APPIMAGE.sig" "release-assets/CC-Switch-${VERSION}-Linux-x86_64.AppImage.sig" \
            || { echo "❌ AppImage.sig 缺失（签名失败？）" >&2; exit 1; }
          DEB=$(find upstream/src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          [ -n "$DEB" ] && cp "$DEB" "release-assets/CC-Switch-${VERSION}-Linux-x86_64.deb" || echo "无 .deb（可选）"
          RPM=$(find upstream/src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          [ -n "$RPM" ] && cp "$RPM" "release-assets/CC-Switch-${VERSION}-Linux-x86_64.rpm" || echo "无 .rpm（可选）"

      # [dokng] 产物交接改走 R2 暂存区，不再用 artifact。
      #
      # 背景：仓库转私有后 artifact 计入账号级存储配额（Free 500MB），三平台产物一两次发布
      # 就撑爆，之后所有 upload-artifact 硬失败（Failed to CreateArtifact: quota has been hit）
      # → 发布链路断死，且配额每 6-12 小时才重算，无法即时恢复。而 R2 是唯一自更新源（客户端
      # 的 latest.json 指向 dl.dokng.com），产物终点本来就是 R2，artifact 只是「跨 job 搬运」
      # 的中转。故直接传到 R2 暂存区，publish job 从那里取回，彻底绕开配额。
      #
      # 暂存前缀 _staging/cc-switch/<run_id>/ 必须在 cc-switch/ 之外：publish job 末尾的清理
      # 步骤会列举 cc-switch/ 下全部对象并按版本 token 判定去留，暂存对象混在里面会被当作垃圾
      # 删除，且会干扰 token 抽取。带产品命名空间是因为本桶被两个产品共用，陈旧回收只应扫自己
      # 的前缀。收尾由 publish job 显式删除。
      #
      # 无 R2 凭据时回退到 artifact（保持原有渐进启用语义：R2 未配置不致整条流水线失败）。
      # 三平台共用此步：Windows runner 的 shell: bash 是 Git Bash，aws CLI 同样预装可用。
      - name: 上传产物到 R2 暂存区
        if: env.R2_ACCESS_KEY_ID != ''
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          LABEL: ${{ matrix.label }}
          # [dokng] Windows runner 上 shell: bash 是 Git Bash（MSYS2）：调用原生 Windows
          # 程序时，凡「看起来像 Unix 路径」的参数都会被自动改写成 Windows 形式。aws 是原生
          # exe，s3://bucket/key 与 https://... 都可能被误判（MSYS2 文档明确说该启发式会把
          # 非路径当路径转换），一旦 s3:// 后的 /key 段被改写，对象就传到错误的 key 上或直接
          # 报错。故按前缀定向排除这两类参数；不用 "*" 全局关闭，因为本步其余参数（本地目录）
          # 仍需要正常转换。此变量在 Linux/macOS 上无副作用，可三平台共用一份。
          MSYS2_ARG_CONV_EXCL: "s3://;https://"
        run: |
          set -euo pipefail
          for v in "$R2_ACCOUNT_ID" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$R2_BUCKET"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          stage="s3://${R2_BUCKET}/_staging/cc-switch/${GITHUB_RUN_ID}"

          # 按 label 分目录，等价原先各平台独立 artifact（同名文件不会互相覆盖）；
          # publish 取回时再平铺，等价 merge-multiple: true。
          # if-no-files-found: error 的等价物——数一遍，空则硬失败。上游收集步骤已对
          # .sig 缺失做过硬校验，这里只兜「整个目录为空」这一类构建漂移。
          n=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "本平台产物 ${n} 个："; ls -la release-assets
          if [ "$n" -eq 0 ]; then
            echo "::error::release-assets/ 为空，拒绝继续" >&2; exit 1
          fi
          aws s3 cp release-assets/ "${stage}/pkg/${LABEL}/" \
            --recursive --endpoint-url "$endpoint" --checksum-algorithm CRC32 --only-show-errors

      # 回退路径：未配置 R2 时仍走 artifact（与 publish job 的回退分支配对）。
      # retention-days: 1 —— 只用于把产物交给下游 publish job，run 结束即无用；默认 90 天会
      # 撑爆账号配额并让后续 upload 全部失败，故压到最小值。
      - name: 上传产物到 workflow（artifact 回退，无 R2 凭据时）
        if: env.R2_ACCESS_KEY_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          # [monorepo] uses: 型步骤不受 defaults.run.working-directory 影响，路径以
          # workspace 根为基准，故必须显式带 cc-switch/ 前缀。artifact 内部结构不变：
          # 匹配到的文件公共父目录（cc-switch/release-assets）被当作 artifact 根，
          # 产物仍平铺在顶层，publish job 的取回逻辑无需改动。
          path: cc-switch/release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 组装 latest.json + R2 上传
    runs-on: ubuntu-22.04
    needs: [resolve, build]
    # [monorepo] 降到 read：本 job 不再建 GitHub Release，也不推 tag，只读仓库 + 写 R2。
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cc-switch
    env:
      # [dokng] 提到 job 级：产物取回步骤用 if: env.R2_ACCESS_KEY_ID 在 R2 直传与 artifact
      # 回退之间二选一。step 级 env 对同一 step 的 if 不可见（if 在 step env 求值前判定），
      # uses: 型步骤更没有 env 块可写，故必须在 job 级声明。
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      # 只要仓库根的 scripts/（组装首页下载清单用），不需要 submodule / 全量历史。
      # 必须排在下载产物之前：actions/checkout 默认清理工作区，放在后面会把
      # release-assets/ 一起删掉。
      - name: Checkout（仅需 scripts/，不带 submodule）
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ needs.resolve.outputs.version }}

      # [dokng] 从 R2 暂存区取回三平台产物（对应 build job 的直传）。
      # 目录形状必须与原 download-artifact + merge-multiple: true 完全一致：
      # 全部产物平铺在 release-assets/，下游「组装 latest.json」按文件名匹配。
      - name: 从 R2 暂存区取回产物
        if: env.R2_ACCESS_KEY_ID != ''
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          for v in "$R2_ACCOUNT_ID" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$R2_BUCKET"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          stage="s3://${R2_BUCKET}/_staging/cc-switch/${GITHUB_RUN_ID}"

          mkdir -p release-assets /tmp/stage-in
          aws s3 cp "${stage}/pkg/" /tmp/stage-in/ \
            --recursive --endpoint-url "$endpoint" --only-show-errors
          # 各平台子目录 → 平铺（等价 merge-multiple: true）。三平台产物文件名互不相同
          # （CC-Switch-<ver>-{macOS,Windows,Linux-x86_64}.*），平铺不会互相覆盖。
          find /tmp/stage-in -type f -exec cp -f {} release-assets/ \;

          # 取回即校验：暂存区为空说明 build job 的直传没生效（而它本该硬失败）。
          # 三平台各自的 updater 载体都必须在场，否则组装出的 latest.json 会缺平台条目，
          # 而缺失的平台在客户端表现为「查不到更新」——静默降级，故在此硬失败。
          n=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "取回产物 ${n} 个"
          for want in "macOS.tar.gz" "Windows.msi" "Linux-x86_64.AppImage"; do
            ls release-assets/*"$want" >/dev/null 2>&1 || {
              echo "::error::R2 暂存区缺少 *${want}（共取回 ${n} 个文件）" >&2; exit 1; }
          done

      # 回退路径：未配置 R2 时仍从 artifact 取（与 build job 的回退分支配对）。
      - name: 下载全部构建产物（artifact 回退，无 R2 凭据时）
        if: env.R2_ACCESS_KEY_ID == ''
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          # [monorepo] 同上：uses: 型步骤路径以 workspace 根为基准，须带前缀，
          # 与本 job 内 run 步骤看到的相对路径 release-assets/ 指向同一目录。
          path: cc-switch/release-assets
          merge-multiple: true

      - name: 列出产物
        shell: bash
        run: ls -la release-assets

      - name: 组装 latest.json
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.version }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          # version 字段必须等于 app 内嵌版本（app_version，纯数字预发布号），updater 才能正确比对。
          # notes 保留原始 tag（含 -ccs.N 品牌标识）。
          VERSION="$APP_VERSION"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://dl.dokng.com/cc-switch"
          # [dokng] 安装包在 R2 上下沉到 cc-switch/<version>/ 子目录（与 open-code 同构）。
          # 子目录名 = 去 v 前缀的 tag（品牌发布号，形如 3.17.0-ccs.4）——与 R2 清理逻辑抽取的
          # -ccs.N token 一致，故清理正则无需改动。注意这不同于安装包文件名内嵌的 APP_VERSION
          # （纯数字 3.17.0-4，因 msi 第 4 段不接受字母），两者独立、互不影响。
          # latest.json 里 url 是绝对地址，Tauri updater 直接按此地址下载，故此处补上子目录段。
          REL_VERSION="${TAG#v}"
          mac_url=""; mac_sig=""
          win_url=""; win_sig=""
          linux_url=""; linux_sig=""
          shopt -s nullglob
          for sig in release-assets/*.sig; do
            fname=$(basename "${sig%.sig}")
            url="$base_url/$REL_VERSION/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *.tar.gz)             mac_url="$url"; mac_sig="$sig_content";;
              *-Windows.msi)        win_url="$url"; win_sig="$sig_content";;
              *-Linux-x86_64.AppImage) linux_url="$url"; linux_sig="$sig_content";;
            esac
          done
          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": \"Release $TAG\","
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_url" ] && [ -n "$mac_sig" ]; then
              for key in darwin-aarch64 darwin-x86_64; do
                [ $first -eq 0 ] && echo ','
                printf '    "%s": {"signature": "%s", "url": "%s"}' "$key" "$mac_sig" "$mac_url"
                first=0
              done
            fi
            if [ -n "$win_url" ] && [ -n "$win_sig" ]; then
              [ $first -eq 0 ] && echo ','
              printf '    "windows-x86_64": {"signature": "%s", "url": "%s"}' "$win_sig" "$win_url"
              first=0
            fi
            if [ -n "$linux_url" ] && [ -n "$linux_sig" ]; then
              [ $first -eq 0 ] && echo ','
              printf '    "linux-x86_64": {"signature": "%s", "url": "%s"}' "$linux_sig" "$linux_url"
              first=0
            fi
            echo ''
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "生成的 latest.json："; cat "$tmp_json"
          python3 -c "import json,sys; json.load(open('$tmp_json'))" && echo "✅ latest.json JSON 合法"
          mv "$tmp_json" release-assets/latest.json

      # [dokng] 组装 latest-downloads.json：给 new-api 首页用的人工下载清单。
      # latest.json 只收录带 .sig 的 updater 载体，macOS 那条是 .tar.gz（解开是 .app），
      # 不适合人工下载；.dmg 因无 .sig 进不了 latest.json，首页也就无从发现它。
      # 故另出一份纯展示清单，三平台各给主推安装包（msi / dmg / AppImage）。
      - name: 组装 latest-downloads.json（首页下载清单）
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build-downloads-manifest.py \
            release-assets "$TAG" "https://dl.dokng.com/cc-switch" \
            release-assets/latest-downloads.json
          echo "生成的 latest-downloads.json："; cat release-assets/latest-downloads.json

      # [monorepo] 原 softprops/action-gh-release@v2 步骤已删除：本仓不发 Release，只留 tag。
      # 下面的 R2 步骤直接读 release-assets/，从不依赖 Release 是否存在，故删除无副作用。

      # R2 上传：产物 + latest.json 推到 dl.dokng.com/cc-switch/（补丁 01 的 updater 源）。
      # 未配置 R2 Secret 时整步跳过（渐进启用），产物仅留在 artifact 里。
      # 用 aws s3 CLI（ubuntu runner 自带，R2 兼容 S3 API）。
      - name: 上传产物到 Cloudflare R2（cc-switch/ 目录）
        if: env.R2_ACCESS_KEY_ID != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          TAG: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for v in "$R2_ACCOUNT_ID" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_BUCKET"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # 版本子目录名 = 去 v 前缀的 tag（品牌发布号，形如 3.17.0-ccs.4），与组装 latest.json 时
          # url 里的前缀（REL_VERSION）一致；也与 R2 清理抽取的 -ccs.N token 一致。
          REL_VERSION="${TAG#v}"

          # [dokng] R2 布局（与 open-code 同构）：
          #   cc-switch/                       ← 产品根，updater 固定 URL 轮询
          #     ├── latest.json                ← 更新元数据（Tauri updater），每版覆盖 → 禁缓存
          #     ├── latest-downloads.json      ← 首页人工下载清单（new-api 读），同上
          #     └── <version>/                 ← 产物 + .sig，URL 每版唯一 → immutable 长缓存
          #         └── *.dmg / *.msi / *.AppImage / *.tar.gz / *.sig 等
          # 两类内容分开上传，套不同 cache-control。
          echo "待上传到 R2 cc-switch/${REL_VERSION}/ 的产物（两个 *.json 单独传根）："; ls -la release-assets
          # --checksum-algorithm CRC32：规避 R2 对 S3 默认分块校验的兼容问题。
          #
          # 缓存分级（关键）：产物/.sig 文件名带版本号且进版本子目录（URL 每版唯一）→ 长缓存
          # immutable，CDN 尽量命中；两个 json 是固定 URL、每版都要覆盖 → 必须禁缓存，否则
          # Cloudflare CDN 会把旧元数据缓存住，客户端拉不到新版本、自更新延迟数小时。
          aws s3 cp release-assets/ "s3://${R2_BUCKET}/cc-switch/${REL_VERSION}/" \
            --recursive \
            --exclude "latest.json" \
            --exclude "latest-downloads.json" \
            --endpoint-url "$endpoint" \
            --checksum-algorithm CRC32 \
            --cache-control "public,max-age=31536000,immutable"

          # [dokng] 发布闸门：两个 json 必须最后写，且只在它们引用的产物全部确认落盘后才写。
          # 元数据一生效，客户端（updater）与 new-api 首页立刻按其中的 url 下载；若某个产物漏传
          # 或半途失败，就会出现「有新版本号、但下载 404」。这里逐个 head-object 复核 R2 上的真实
          # 对象（要求存在且字节数 > 0），任一缺失即整步失败退出——此时两个 json 都尚未更新，
          # 线上仍是上一个完整可下载的版本，客户端与首页都不受影响。
          # 从两个 json 抽出全部 url（绝对地址）→ 去掉协议与主机名，得到 R2 object key；
          # 多处可能指向同一个包（mac 双架构共用 tar.gz），故去重。
          mapfile -t want_keys < <(
            grep -hoE '"url": "[^"]+"' \
              release-assets/latest.json release-assets/latest-downloads.json \
              | sed -E 's#^"url": "https?://[^/]+/##; s#"$##' \
              | grep -v '^$' | sort -u
          )
          if [ "${#want_keys[@]}" -eq 0 ]; then
            echo "::error::两个 json 均未引用任何产物，拒绝更新元数据"; exit 1
          fi
          echo "复核 latest.json / latest-downloads.json 引用的产物是否已落盘 R2："
          for key in "${want_keys[@]}"; do
            [ -n "$key" ] || continue
            size="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$endpoint" --query ContentLength --output text 2>/dev/null || true)"
            if ! printf '%s' "$size" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::R2 缺少产物 $key（元数据未更新，线上仍为上一版本）"; exit 1
            fi
            echo "  ✓ $key（${size} 字节）"
          done

          # 两份元数据都是固定 URL、每版覆盖 → 同样禁缓存。
          for j in latest.json latest-downloads.json; do
            aws s3 cp "release-assets/$j" "s3://${R2_BUCKET}/cc-switch/$j" \
              --endpoint-url "$endpoint" \
              --checksum-algorithm CRC32 \
              --content-type "application/json" \
              --cache-control "no-cache,max-age=0,must-revalidate"
          done
          echo "R2 上传完成：s3://${R2_BUCKET}/cc-switch/（两个 json 禁缓存，产物 immutable）"

          # [dokng] 只保留最新 1 个版本：产物按 cc-switch/<version>/ 分目录存放，key 形如
          # cc-switch/3.17.0-ccs.N/xxx。列出 cc-switch/ 下全部对象（--recursive）→ 抽版本 token →
          # sort -V 取最新 N 个为保留集 → 逐 key 精确比对（grep -qxF 整行匹配，避免 ccs.2
          # 误伤 ccs.20），版本不在保留集的对象删除；无版本 token 的对象（根下 latest.json）永远保留。
          #
          # 版本 token 正则不能带 v? 前缀（关键）：产物文件名内嵌带 v 的 tag
          # （CC-Switch-v3.18.0-ccs.1-Windows.msi），而目录名是去 v 的 3.18.0-ccs.1。若正则写
          # 'v?...'，同一个 key 会抽出两个 token（目录名的与文件名的），versions 集合被灌成双份，
          # 且 sort -V 把带 v 的全排在后面 → keep 集全是带 v 的假 token，而逐 key 比对时 head -1
          # 取到的是不带 v 的真 token，一个都匹配不上 → 连刚发布的当前版本都会被删光。
          # 统一只认不带 v 的目录名形态：文件名里的 vX.Y.Z-ccs.N 因前导 v 不匹配而被忽略，
          # 每个 key 只产出目录名这一个 token。
          #
          # 清理放在 latest.json 写入之后：先让新版本元数据生效，再删旧包，避免清理失败
          # （权限/网络）时把已经完成的发布一起中断。
          KEEP_VERSIONS=1
          mapfile -t all_keys < <(
            aws s3 ls "s3://${R2_BUCKET}/cc-switch/" --recursive --endpoint-url "$endpoint" \
              | awk '{print $4}' | grep -v '^$' || true
          )
          if [ "${#all_keys[@]}" -gt 0 ]; then
            versions="$(printf '%s\n' "${all_keys[@]}" \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-ccs\.[0-9]+' | sort -V -u || true)"
            total="$(printf '%s\n' "$versions" | grep -c . || true)"
            keep="$(printf '%s\n' "$versions" | tail -n "$KEEP_VERSIONS")"

            # [dokng] 在役版本保护（与 open-code 同构）：保留集并入根下 latest.json 实际引用的
            # 版本，读的是 R2 上刚生效的那份而非本地副本。本产品只有单个 latest.json 且每次整体
            # 重建，正常路径下它引用的就是当前版本，这一步是恒等的；留着是为了让「绝不删掉正在
            # 被元数据引用的包」成为一条与产品无关的硬约束——将来若改成分平台元数据、或元数据
            # 写入部分失败留下错位状态，都不会退化成删掉在役版本。
            # 两个根元数据都要读：latest.json（updater）与 latest-downloads.json（首页清单）
            # 各自引用版本，任一引用到的版本都不能被清理。
            served=""
            for j in latest.json latest-downloads.json; do
              v_in_json="$(aws s3 cp "s3://${R2_BUCKET}/cc-switch/$j" - \
                --endpoint-url "$endpoint" 2>/dev/null \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-ccs\.[0-9]+' | sort -u || true)"
              [ -n "$v_in_json" ] && served="${served}${v_in_json}"$'\n'
            done
            served="$(printf '%s' "$served" | grep -v '^$' | sort -V -u || true)"
            if [ -n "$served" ]; then
              echo "根下元数据仍在引用的版本（一并保留）："
              printf '  served: %s\n' $served
              keep="$(printf '%s\n%s\n' "$keep" "$served" | grep -v '^$' | sort -V -u)"
            fi

            echo "R2 现有版本共 ${total} 个，保留集："
            printf '  keep: %s\n' $keep
            # 兜底：当前发布版本必须在保留集内，否则说明 token 抽取又出了偏差 → 跳过清理，
            # 宁可留下垃圾对象，也不能删掉正在服务的版本。
            if ! printf '%s\n' "$keep" | grep -qxF "$REL_VERSION"; then
              echo "::warning::当前版本 ${REL_VERSION} 不在保留集内，跳过清理（疑似版本 token 抽取异常）"
              exit 0
            fi
            if [ "${total:-0}" -gt "$KEEP_VERSIONS" ]; then
              for key in "${all_keys[@]}"; do
                v="$(printf '%s' "$key" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-ccs\.[0-9]+' | head -1 || true)"
                # 无版本 token（根下 latest.json 等）→ 永远保留。
                [ -n "$v" ] || continue
                if ! printf '%s\n' "$keep" | grep -qxF "$v"; then
                  echo "  清理旧版本对象：$key"
                  aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "$endpoint" || true
                fi
              done
            else
              echo "版本数未超过保留上限，无需清理。"
            fi
          fi
          echo "R2 版本清理完成。"

      # [dokng] 清理本次 run 的 R2 暂存区。
      # 刻意不加 if: always()：本步只在上面的上传、发布闸门与版本清理全部走完后才执行。若
      # publish job 中途失败，暂存区必须原地留着——重跑 job 时「从 R2 暂存区取回产物」还能拿到
      # 同一批产物，无需重跑三平台构建矩阵（artifact 时代靠 retention 提供的正是这个能力）。
      # 顺带扫掉 3 天前的陈旧暂存前缀：失败后再也没重跑的 run 会把对象永久留在桶里，
      # 这里做一次有界的兜底回收（删除失败一律不阻断发布，故全部 || true）。
      # 只扫 _staging/cc-switch/ —— 同一个桶里 open-code 也有自己的暂存命名空间，不能越界。
      - name: 清理 R2 暂存区
        if: env.R2_ACCESS_KEY_ID != ''
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          for v in "$R2_ACCOUNT_ID" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$R2_BUCKET"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "删除本次 run 的暂存区：_staging/cc-switch/${GITHUB_RUN_ID}/"
          aws s3 rm "s3://${R2_BUCKET}/_staging/cc-switch/${GITHUB_RUN_ID}/" \
            --recursive --endpoint-url "$endpoint" --only-show-errors || true

          # 陈旧暂存回收：按对象 LastModified 判龄（aws s3 ls --recursive 输出 "日期 时间 大小 key"），
          # 日期是 YYYY-MM-DD，可直接字符串比较。只删早于 cutoff 的对象，不碰当天/近两天的
          # ——并发的其他 run 可能正在往自己的前缀里写。
          cutoff="$(date -u -d '3 days ago' +%Y-%m-%d)"
          echo "回收 ${cutoff} 之前的陈旧暂存对象："
          stale=0
          while read -r d _t _s key; do
            [ -n "${key:-}" ] || continue
            [[ "$d" < "$cutoff" ]] || continue
            echo "  清理陈旧暂存：$key"
            aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "$endpoint" --only-show-errors || true
            stale=$((stale + 1))
          done < <(aws s3 ls "s3://${R2_BUCKET}/_staging/cc-switch/" --recursive --endpoint-url "$endpoint" 2>/dev/null || true)
          echo "暂存区清理完成（陈旧对象 ${stale} 个）。"
