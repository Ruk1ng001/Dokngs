name: cc-switch auto-upgrade

# 每日自动升级 cc-switch 上游基线（brand/BASE_TAG + BASE_SHA + submodule gitlink）。
#
# [monorepo] 本产品位于仓库子目录 cc-switch/，job 声明 defaults.run.working-directory:
# cc-switch，使全部 run 步骤的相对路径（scripts/、brand/、upstream/）语义与单仓时代一致。
# step 级 working-directory 与 uses: 型步骤的路径参数（cache-dependency-path、
# rust-cache workspaces）不受该默认值影响，必须显式带 cc-switch/ 前缀。
#
# 设计（对齐 brand/ 补丁叠加层架构，与 open-code 那套同构，仅适配 Tauri + pnpm）：
#   - submodule（cc-switch/upstream/）永远锁在「干净的上游 tag」，定制全在 brand/patches/*.patch；
#   - 「升级」= 把基线 tag 推进到上游最新稳定 tag，并验证所有补丁仍能干净重放。
#
# 流程（单 job，任一步失败即报错、GitHub 通知维护者手动介入）：
#   detect   —— fetch submodule tag，筛出最新稳定 tag（vX.Y.Z），与 BASE_TAG 比较；
#               无新版本 → no-op 成功退出；有降级风险（当前反而更新）→ 不动。
#   validate —— submodule 干净 checkout 到新 tag → scripts/apply-patches.sh 完整重放
#               （补丁 + overlay + i18n 合并 + updater 注入，与出包流程完全一致）→
#               pnpm install → pnpm typecheck →（新增）cargo check：Rust 侧补丁/overlay
#               （commands/services/account.rs、tray.rs、lib.rs 锚点）随上游重命名破裂时
#               在升级 job 就抓出来，而不是等三平台 release build 才红。
#   commit   —— 全通过 → 恢复 submodule 干净（gitlink 指向干净 tag，不含补丁）→
#               更新 BASE_TAG/BASE_SHA/gitlink → 提交 → 用 PAT 直推 main。
#
# 为什么用 PAT 推送：
#   GitHub 默认的 GITHUB_TOKEN 推 main 不会触发其它 workflow（防无限循环），
#   而升级后需要触发出包流程，故用 RELEASE_PAT（repo 权限）推送。
#   若暂未接出包流程，用默认 GITHUB_TOKEN 也可（只推基线，不触发下游）。
#
# 触发：
#   - schedule：UTC 16:37 = 北京时间次日 00:37（凌晨，错开整点与上游发布高峰）；
#   - workflow_dispatch：手动随时触发。

on:
  schedule:
    # 北京时间 00:37（UTC+8） → UTC 16:37。避开整点，减少与上游发布高峰重叠。
    - cron: "37 16 * * *"
  workflow_dispatch:

# 同时只跑一个升级流水线，避免并发写 main。
# [monorepo] group 带产品名：open-code 的升级流水线也写 main，两者互不该排队等对方
# （各自只改自己子目录的基线文件，推送冲突由步骤内的 pull --rebase 重试兜住）。
concurrency:
  group: cc-switch-auto-upgrade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-switch
    steps:
      # [monorepo] submodules: false —— 不能用 recursive，否则白拉 open-code 的
      # opencode（488M）+ infinite-canvas（6M）。只按需初始化本产品这一个。
      - name: Checkout（不带 submodule；用 PAT 以便推送能触发下游 workflow）
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          # RELEASE_PAT：repo 权限的 PAT。用它 checkout，后续 git push 即带 PAT 凭据，
          # 推 main 才能触发出包 workflow（默认 GITHUB_TOKEN 不触发其它 workflow）。
          # 未配置 RELEASE_PAT 时回退默认 GITHUB_TOKEN（只推基线，不触发下游出包）。
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # 不加 --depth=1：detect 步骤要 fetch --tags 后按 tag 列表挑最新稳定版，且
      # validate 要 checkout 到任意历史 tag 并做补丁 strict apply，浅克隆会缺对象。
      - name: 初始化 cc-switch/upstream submodule
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git submodule update --init cc-switch/upstream
          echo "submodule 就绪：$(git -C cc-switch/upstream rev-parse --short HEAD)"

      - name: 检测上游最新稳定 tag
        id: detect
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < brand/BASE_TAG)"
          echo "当前基线 tag：$CURRENT"

          # 拉取 submodule 所有 tag（origin = farion1231/cc-switch，已同步上游）。
          git -C upstream fetch --tags --quiet origin

          # 只认稳定版 tag vX.Y.Z（排除 -rc / beta / pr-* 等），按语义版本取最大。
          LATEST="$(git -C upstream tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          echo "上游最新稳定 tag：${LATEST:-<无>}"

          if [ -z "$LATEST" ]; then
            echo "未找到任何稳定 tag，异常退出。" >&2
            exit 1
          fi

          # 降级保护：只有当 LATEST 严格新于 CURRENT 时才升级。
          NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)"
          if [ "$LATEST" != "$CURRENT" ] && [ "$NEWEST" = "$LATEST" ]; then
            echo "发现新版本：$CURRENT → $LATEST"
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "已是最新（或当前基线更新），无需升级。"
            echo "need=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 pnpm
        if: steps.detect.outputs.need == 'true'
        uses: pnpm/action-setup@v4
        with:
          # 上游 package.json 无 packageManager 字段，action-setup 无法自动推断，
          # 必须显式给版本。cc-switch 用 pnpm 9.x，此处锁大版本；上游若升 pnpm，
          # 补丁重放/typecheck 报错会通知维护者，届时同步调这里即可。
          version: 9

      - name: 安装 Node
        if: steps.detect.outputs.need == 'true'
        uses: actions/setup-node@v4
        with:
          # 上游 package.json 无 engines/volta、仓库无 .nvmrc，node-version-file 会报错。
          # 故显式指定 Node LTS（20.x）。cache 走 pnpm-lock.yaml。
          node-version: 20
          cache: pnpm
          # [monorepo] uses: 型步骤路径以 workspace 根为基准，须带 cc-switch/ 前缀。
          cache-dependency-path: cc-switch/upstream/pnpm-lock.yaml

      - name: 切到新 tag 并按 NN 序重放补丁（strict apply）
        if: steps.detect.outputs.need == 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          # 干净 checkout 到新 tag（detached）；清掉任何残留，确保基线纯净。
          git -C upstream checkout --quiet "$LATEST"
          git -C upstream reset --hard --quiet
          git -C upstream clean -fdq

          # 在改动 submodule 前先做纯格式/语法预检；corrupt patch 必须零副作用提前失败。
          scripts/apply-patches.sh --preflight

          # 用统一的重放脚本（strict apply）落地补丁——与出包流程同一来源，避免逻辑漂移。
          # 此刻 brand/BASE_SHA 还是旧基线（升级成功后才刷新），脚本会 warn HEAD≠BASE_SHA，
          # 但不致命：apply 模式只要求 upstream/ 工作区干净 + 补丁精确适用；任一补丁失败即非 0
          # → 步骤失败 → 通知维护者手动介入。
          echo "完整重放品牌层到 $LATEST（补丁 + overlay + i18n + updater 注入）："
          if scripts/apply-patches.sh; then
            echo "品牌层重放成功。"
          else
            # strict 失败：上游 $LATEST 很可能改到了补丁热点文件。直接在当前 $LATEST 工作区
            # 逐补丁 3way 试应用，把冲突 hunk 落成 .rej 打印出来——诊断基于正确的新基线
            # （此刻 BASE_SHA 还是旧的，--check-3way 会基于旧基线不准），让维护者一眼看到
            # 哪个补丁的哪些 hunk 撞上了上游改动，缩短 rebase 定位时间。
            echo "::group::strict apply 失败——3way 漂移诊断（基于新基线 ${LATEST}）" >&2
            git -C upstream reset --hard --quiet
            git -C upstream clean -fdq
            # 诊断必须保留「前序补丁已落地」的累积状态：补丁栈按 NN 序叠加，依赖前序的
            # 补丁若在原始基线上单独试应用会因缺前序而误报冲突。故每个补丁成功后就地
            # commit 成检查点，冲突时 reset 回检查点（含前序、不含本补丁）再走纯 --reject。
            # 这些 commit 只存在于这个一次性诊断工作区，收尾 checkout 回 tag 即丢弃。
            for p in brand/patches/*.patch; do
              [ -e "$p" ] || continue
              name="$(basename "$p")"
              if git -C upstream apply --3way "$PWD/$p" >/dev/null 2>&1; then
                echo "  3way OK   $name" >&2
                git -C upstream add -A >/dev/null 2>&1 || true
                git -C upstream -c user.name=ci -c user.email=ci@local \
                  commit -q --allow-empty -m "diag: $name" || true
              else
                echo "  3way 冲突 ${name}：" >&2
                # --reject 与 --3way 互斥（同用直接报 "cannot be used together"，
                # 于是一个 .rej 都产不出、诊断信息全丢）。故冲突分支走纯 --reject。
                # 先 reset 回检查点：失败的 --3way 不是原子回滚，能合并的文件会留在
                # index/工作区，脏状态下 --reject 会把本可干净套上的 hunk 误判成
                # already-applied 而整体落 .rej，诊断失真。
                git -C upstream reset --hard --quiet || true
                git -C upstream clean -fdq || true
                git -C upstream apply --reject "$PWD/$p" 2>&1 | sed 's/^/      /' >&2 || true
                find upstream -name '*.rej' -print 2>/dev/null | sed 's/^/      rej: /' >&2 || true
                # 清掉 .rej 与半落地改动回到检查点：本补丁算未落地，后续补丁仍在
                # 「前序已落地」的正确基础上诊断。
                git -C upstream reset --hard --quiet || true
                git -C upstream clean -fdq || true
              fi
            done
            # 收尾：丢弃全部诊断 commit，回到干净的 $LATEST。
            git -C upstream checkout --quiet --detach "$LATEST"
            git -C upstream reset --hard --quiet; git -C upstream clean -fdq
            echo "::endgroup::" >&2
            echo "补丁 strict apply 失败，需人工把补丁 rebase 到 ${LATEST}（见上方 3way 诊断）。" >&2
            exit 1
          fi

      - name: 安装依赖 + typecheck（前端自洽校验）
        if: steps.detect.outputs.need == 'true'
        working-directory: ${{ github.workspace }}/cc-switch/upstream
        run: |
          set -euo pipefail
          # pnpm install 加重试：npm registry 偶发单包 tarball 下载失败，一次失败即中断。
          # 重试 3 次、间隔递增（15s/30s）消除瞬时网络抖动；三次仍失败才真正报错。
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ "$attempt" = 3 ]; then
              echo "pnpm install 连续 3 次失败，放弃。" >&2
              exit 1
            fi
            echo "pnpm install 第 $attempt 次失败，$((attempt * 15))s 后重试…" >&2
            sleep $((attempt * 15))
          done
          # 前端 typecheck，快速验证补丁应用后类型仍自洽；Rust 侧由下面的 cargo check 覆盖。
          pnpm typecheck

      - name: 安装 Rust（与 upstream/rust-toolchain.toml 同 channel）
        if: steps.detect.outputs.need == 'true'
        uses: dtolnay/rust-toolchain@1.95

      - name: 安装 Linux 系统依赖（tauri cargo check 所需）
        if: steps.detect.outputs.need == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Rust 编译缓存
        if: steps.detect.outputs.need == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # [monorepo] 同上：uses: 型步骤路径以 workspace 根为基准。
          workspaces: cc-switch/upstream/src-tauri

      - name: cargo check（Rust 侧补丁/overlay 自洽校验）
        if: steps.detect.outputs.need == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # tauri::generate_context! 宏在编译期读取 frontendDist（../dist）内嵌资源，
          # 目录不存在会让宏展开失败——建空目录即可满足 cargo check（不做前端产物构建）。
          mkdir -p upstream/dist
          cargo check --locked --manifest-path upstream/src-tauri/Cargo.toml

      - name: 校验通过 → 更新基线、提交并推送 main
        if: steps.detect.outputs.need == 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          # 恢复 submodule 干净：撤销临时 apply 的补丁，gitlink 记录的是干净 tag 的 HEAD。
          git -C upstream reset --hard --quiet
          git -C upstream clean -fdq

          NEWSHA="$(git -C upstream rev-parse HEAD)"
          echo "新基线：$LATEST（$NEWSHA）"

          # 更新基线双文件（保留尾换行，与既有格式一致）。
          printf '%s\n' "$LATEST" > brand/BASE_TAG
          printf '%s\n' "$NEWSHA" > brand/BASE_SHA

          git add brand/BASE_TAG brand/BASE_SHA upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cc-switch): 自动升级基线到 ${LATEST}（每日自动）"

          # 推 main（保存基线推进）。
          # 加 pull --rebase + 重试：定时任务与手动触发 / 维护者推送可能并发，
          # 裸 push 遇 non-fast-forward 会被拒。重试 3 次，每次先 rebase 再推；
          # 基线文件冲突极少（只有并发升级才可能），冲突时放弃自动 rebase，让 job 失败
          # 等人工介入（不强推、不覆盖他人提交）。
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push main 第 $attempt 次失败（可能 non-fast-forward），rebase 后重试…" >&2
            git fetch origin main --quiet || true
            git rebase origin/main || { git rebase --abort || true; break; }
          done
          [ "$pushed" = true ] || { echo "push main 连续 3 次失败，放弃（无污染，可重跑）。" >&2; exit 1; }
          echo "已推送 main。"

          # 计算下一个 ccs 版本 tag（vX.Y.Z-ccs.N，基于新基线 BASE_TAG），打 tag 并推送
          # （release workflow 触发器为 push tags v*-ccs.*，推此 tag 即触发自动出包）。
          # push tag 加 3 次重试：main 已推进而 tag 未推出会让「基线已升级但没出包」，
          # 且次日 cron 因已最新 no-op、永远不补——必须在本次 job 内尽力送达，
          # 三次仍失败则响亮报错（维护者可手动补：git push origin <tag>）。
          git fetch --tags --quiet origin || true
          NEWTAG="$(scripts/next-version.sh)"
          echo "新 ccs 版本 tag：$NEWTAG"
          git tag "$NEWTAG"
          tag_pushed=false
          for attempt in 1 2 3; do
            if git push origin "$NEWTAG"; then
              tag_pushed=true
              break
            fi
            echo "push tag $NEWTAG 第 $attempt 次失败，$((attempt * 5))s 后重试…" >&2
            sleep $((attempt * 5))
          done
          if [ "$tag_pushed" != true ]; then
            echo "❌ push tag $NEWTAG 连续 3 次失败：main 已升级但未触发出包。" >&2
            echo "   请手动补推：git push origin $NEWTAG（或 workflow_dispatch 触发 release）。" >&2
            exit 1
          fi
          echo "已推送 tag $NEWTAG。"
